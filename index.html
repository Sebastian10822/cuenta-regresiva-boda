<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">

  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>💍 El gran día se acerca</title>

  <!-- Fuentes -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link
    href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700&family=Playfair+Display:wght@400;500;600;700&display=swap"
    rel="stylesheet"
  >

  <!-- ==============================
       VISTA PREVIA DE WHATSAPP
       ============================== -->

  <meta
    property="og:title"
    content="💍 El gran día se acerca"
  >

  <meta
    property="og:description"
    content="Faltan muy pocos días para celebrar este momento tan especial. ❤️"
  >

  <meta
    property="og:image"
    content="https://wedding-countdown-vercel.vercel.app/boda.jpg"
  >

  <meta
    property="og:type"
    content="website"
  >

  <meta
    property="og:url"
    content="https://wedding-countdown-vercel.vercel.app/"
  >

  <meta
    name="twitter:card"
    content="summary_large_image"
  >

  <meta
    name="twitter:title"
    content="💍 El gran día se acerca"
  >

  <meta
    name="twitter:description"
    content="La cuenta regresiva para un día muy especial ❤️"
  >

  <meta
    name="twitter:image"
    content="https://wedding-countdown-vercel.vercel.app/boda.jpg"
  >

  <style>

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html {
      min-height: 100%;
    }

    body {
      min-height: 100vh;

      font-family: "Montserrat", sans-serif;

      color: #ffffff;

      background:
        linear-gradient(
          rgba(0, 0, 0, 0.38),
          rgba(0, 0, 0, 0.58)
        ),
        url("boda.jpg");

      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      background-attachment: fixed;

      display: flex;
      justify-content: center;
      align-items: center;

      padding: 25px;
    }

    /* ==============================
       CONTENEDOR PRINCIPAL
       ============================== */

    .container {
      width: 100%;
      max-width: 900px;

      padding: 55px 40px;

      text-align: center;

      background:
        linear-gradient(
          135deg,
          rgba(255,255,255,0.15),
          rgba(255,255,255,0.07)
        );

      border: 1px solid rgba(255,255,255,0.28);

      border-radius: 28px;

      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);

      box-shadow:
        0 25px 70px rgba(0,0,0,0.38),
        inset 0 1px 0 rgba(255,255,255,0.18);

      animation: aparecer 1.1s ease;
    }

    /* ==============================
       TEXTO SUPERIOR
       ============================== */

    .small-title {
      font-size: 12px;

      font-weight: 500;

      letter-spacing: 4px;

      text-transform: uppercase;

      margin-bottom: 17px;

      opacity: 0.88;
    }

    /* ==============================
       TITULO
       ============================== */

    h1 {
      font-family: "Playfair Display", serif;

      font-size: clamp(42px, 7vw, 72px);

      font-weight: 500;

      line-height: 1.08;

      margin-bottom: 18px;

      text-shadow:
        0 4px 18px rgba(0,0,0,0.4);
    }

    .heart {
      display: inline-block;

      font-size: 27px;

      margin-left: 5px;

      animation: latido 1.7s infinite;
    }

    /* ==============================
       SUBTITULO
       ============================== */

    .subtitle {
      font-size: 15px;

      font-weight: 300;

      line-height: 1.7;

      max-width: 560px;

      margin: 0 auto 40px;

      opacity: 0.9;
    }

    /* ==============================
       CUENTA REGRESIVA
       ============================== */

    .countdown {
      display: grid;

      grid-template-columns:
        repeat(4, 1fr);

      gap: 16px;

      margin-top: 10px;
    }

    .time-box {
      padding: 25px 15px;

      background:
        rgba(255,255,255,0.13);

      border: 1px solid
        rgba(255,255,255,0.20);

      border-radius: 20px;

      box-shadow:
        inset 0 1px 0
        rgba(255,255,255,0.12);

      transition:
        transform 0.3s ease,
        background 0.3s ease;
    }

    .time-box:hover {
      transform: translateY(-5px);

      background:
        rgba(255,255,255,0.19);
    }

    .number {
      display: block;

      font-size: clamp(34px, 6vw, 55px);

      font-weight: 500;

      line-height: 1;

      margin-bottom: 10px;

      text-shadow:
        0 3px 12px rgba(0,0,0,0.3);
    }

    .label {
      font-size: 10px;

      text-transform: uppercase;

      letter-spacing: 2.5px;

      opacity: 0.8;
    }

    /* ==============================
       FECHA
       ============================== */

    .date {
      margin-top: 38px;

      font-family:
        "Playfair Display",
        serif;

      font-size: 20px;

      font-weight: 400;

      opacity: 0.95;
    }

    /* ==============================
       MENSAJE FINAL
       ============================== */

    .message {
      display: none;

      font-family:
        "Playfair Display",
        serif;

      font-size:
        clamp(28px, 5vw, 48px);

      line-height: 1.3;
    }

    /* ==============================
       PIE
       ============================== */

    .footer {
      margin-top: 28px;

      font-size: 11px;

      letter-spacing: 1px;

      opacity: 0.65;
    }

    /* ==============================
       ANIMACIONES
       ============================== */

    @keyframes latido {

      0%,
      100% {
        transform: scale(1);
      }

      50% {
        transform: scale(1.16);
      }
    }

    @keyframes aparecer {

      from {
        opacity: 0;

        transform:
          translateY(25px);
      }

      to {
        opacity: 1;

        transform:
          translateY(0);
      }
    }

    /* ==================================================
       VERSION PARA CELULAR
       ================================================== */

    @media (max-width: 700px) {

      body {

        min-height: 100svh;

        padding: 16px;

        background:
          linear-gradient(
            rgba(0,0,0,0.28),
            rgba(0,0,0,0.60)
          ),
          url("boda.jpg");

        background-size: cover;

        background-position:
          center center;

        background-attachment:
          scroll;
      }

      .container {

        max-width: 480px;

        padding:
          38px 18px 30px;

        border-radius: 26px;

        background:
          linear-gradient(
            145deg,
            rgba(255,255,255,0.16),
            rgba(255,255,255,0.06)
          );

        backdrop-filter:
          blur(9px);

        -webkit-backdrop-filter:
          blur(9px);

        box-shadow:
          0 18px 50px
          rgba(0,0,0,0.40),
          inset 0 1px 0
          rgba(255,255,255,0.18);
      }

      .small-title {

        font-size: 9px;

        letter-spacing: 3.2px;

        margin-bottom: 13px;
      }

      h1 {

        font-size:
          clamp(34px, 10vw, 48px);

        line-height: 1.08;

        margin-bottom: 16px;
      }

      .heart {

        font-size: 21px;

        margin-left: 3px;
      }

      .subtitle {

        font-size: 13px;

        line-height: 1.65;

        max-width: 310px;

        margin-bottom: 30px;
      }

      .countdown {

        grid-template-columns:
          repeat(2, 1fr);

        gap: 10px;
      }

      .time-box {

        padding:
          19px 8px;

        border-radius: 17px;

        background:
          rgba(255,255,255,0.12);
      }

      .number {

        font-size:
          clamp(30px, 10vw, 39px);

        margin-bottom: 8px;
      }

      .label {

        font-size: 8px;

        letter-spacing: 1.8px;
      }

      .date {

        margin-top: 28px;

        font-size: 17px;

        line-height: 1.4;
      }

      .footer {

        margin-top: 22px;

        font-size: 9px;

        line-height: 1.5;
      }
    }

    /* ==================================================
       CELULARES PEQUEÑOS
       ================================================== */

    @media (max-width: 380px) {

      body {

        padding: 10px;
      }

      .container {

        padding:
          30px 14px 24px;

        border-radius: 22px;
      }

      .small-title {

        font-size: 8px;

        letter-spacing: 2.7px;
      }

      h1 {

        font-size: 32px;
      }

      .subtitle {

        font-size: 12px;

        max-width: 280px;
      }

      .time-box {

        padding:
          17px 6px;
      }

      .number {

        font-size: 29px;
      }

      .label {

        font-size: 7px;

        letter-spacing: 1.5px;
      }

      .date {

        font-size: 16px;
      }
    }

  </style>
</head>

<body>

  <main class="container">

    <div class="small-title">
      Cuenta regresiva
    </div>

    <h1>
      El gran día se acerca
      <span class="heart">♥</span>
    </h1>

    <p class="subtitle">
      Cada segundo nos acerca a un momento inolvidable
    </p>

    <!-- CUENTA REGRESIVA -->

    <div
      id="countdown"
      class="countdown"
    >

      <div class="time-box">

        <span
          id="days"
          class="number"
        >
          0
        </span>

        <span class="label">
          Días
        </span>

      </div>

      <div class="time-box">

        <span
          id="hours"
          class="number"
        >
          0
        </span>

        <span class="label">
          Horas
        </span>

      </div>

      <div class="time-box">

        <span
          id="minutes"
          class="number"
        >
          0
        </span>

        <span class="label">
          Minutos
        </span>

      </div>

      <div class="time-box">

        <span
          id="seconds"
          class="number"
        >
          0
        </span>

        <span class="label">
          Segundos
        </span>

      </div>

    </div>

    <!-- MENSAJE CUANDO LLEGUE EL DÍA -->

    <div
      id="message"
      class="message"
    >

      💍 ¡LLEGÓ EL GRAN DÍA! 💍

      <br>

      <span style="font-size: 0.7em;">
        ¡Que vivan los novios! ❤️
      </span>

    </div>

    <!-- FECHA -->

    <div class="date">
      11 de octubre de 2026 · 4:00 p. m.
    </div>

    <div class="footer">
      Un día para recordar siempre
    </div>

  </main>


  <script>

    /*
      ============================================
      FECHA DEL EVENTO
      ============================================

      11 de octubre de 2026
      4:00 p. m.
      Colombia (UTC-5)

      El contador calcula automáticamente
      cuánto tiempo falta desde el momento
      exacto en que se abre la página.
    */

    const weddingDate =
      new Date(
        "2026-10-11T16:00:00-05:00"
      ).getTime();


    function updateCountdown() {

      // Hora actual del dispositivo
      const now =
        new Date().getTime();


      // Diferencia entre la fecha del evento
      // y el momento actual
      const difference =
        weddingDate - now;


      // Cuando llegue el gran día
      if (difference <= 0) {

        document
          .getElementById("countdown")
          .style.display = "none";

        document
          .getElementById("message")
          .style.display = "block";

        return;
      }


      // Días
      const days =
        Math.floor(
          difference /
          (1000 * 60 * 60 * 24)
        );


      // Horas
      const hours =
        Math.floor(
          (
            difference %
            (1000 * 60 * 60 * 24)
          ) /
          (1000 * 60 * 60)
        );


      // Minutos
      const minutes =
        Math.floor(
          (
            difference %
            (1000 * 60 * 60)
          ) /
          (1000 * 60)
        );


      // Segundos
      const seconds =
        Math.floor(
          (
            difference %
            (1000 * 60)
          ) /
          1000
        );


      // Mostrar días
      document
        .getElementById("days")
        .textContent =
        String(days)
          .padStart(2, "0");


      // Mostrar horas
      document
        .getElementById("hours")
        .textContent =
        String(hours)
          .padStart(2, "0");


      // Mostrar minutos
      document
        .getElementById("minutes")
        .textContent =
        String(minutes)
          .padStart(2, "0");


      // Mostrar segundos
      document
        .getElementById("seconds")
        .textContent =
        String(seconds)
          .padStart(2, "0");
    }


    // Mostrar inmediatamente
    updateCountdown();


    // Actualizar cada segundo
    setInterval(
      updateCountdown,
      1000
    );

  </script>

</body>
</html>
