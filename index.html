<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">

  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>💍 El gran día se acerca</title>

  <!-- Fuentes -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link
    href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700&family=Playfair+Display:wght@500;600;700&display=swap"
    rel="stylesheet"
  >

  <!-- =========================================
       VISTA PREVIA PARA WHATSAPP Y REDES SOCIALES
       ========================================= -->

  <meta
    property="og:title"
    content="💍 El gran día se acerca"
  >

  <meta
    property="og:description"
    content="Faltan muy pocos días para celebrar este momento tan especial. ❤️"
  >

  <meta
    property="og:image"
    content="https://wedding-countdown-vercel.vercel.app/boda.jpg"
  >

  <meta
    property="og:type"
    content="website"
  >

  <meta
    property="og:url"
    content="https://wedding-countdown-vercel.vercel.app/"
  >

  <meta
    name="twitter:card"
    content="summary_large_image"
  >

  <meta
    name="twitter:title"
    content="💍 El gran día se acerca"
  >

  <meta
    name="twitter:description"
    content="La cuenta regresiva para un día muy especial ❤️"
  >

  <meta
    name="twitter:image"
    content="https://wedding-countdown-vercel.vercel.app/boda.jpg"
  >

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;

      font-family: "Montserrat", sans-serif;

      color: white;

      background-image:
        linear-gradient(
          rgba(0, 0, 0, 0.45),
          rgba(0, 0, 0, 0.55)
        ),
        url("boda.jpg");

      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      background-attachment: fixed;

      display: flex;
      justify-content: center;
      align-items: center;

      padding: 25px;
    }

    .container {
      width: 100%;
      max-width: 900px;

      padding: 55px 40px;

      text-align: center;

      background: rgba(255, 255, 255, 0.12);

      border: 1px solid rgba(255, 255, 255, 0.3);

      border-radius: 25px;

      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);

      box-shadow:
        0 20px 60px rgba(0, 0, 0, 0.35);

      animation: aparecer 1.2s ease;
    }

    .small-title {
      font-size: 14px;

      font-weight: 500;

      letter-spacing: 4px;

      text-transform: uppercase;

      margin-bottom: 15px;

      opacity: 0.9;
    }

    h1 {
      font-family: "Playfair Display", serif;

      font-size: clamp(38px, 7vw, 72px);

      line-height: 1.1;

      margin-bottom: 15px;

      text-shadow:
        0 4px 15px rgba(0, 0, 0, 0.35);
    }

    .subtitle {
      font-size: 16px;

      font-weight: 300;

      margin-bottom: 40px;

      opacity: 0.95;
    }

    .heart {
      display: inline-block;

      font-size: 28px;

      margin: 0 8px;

      animation: latido 1.5s infinite;
    }

    .countdown {
      display: grid;

      grid-template-columns:
        repeat(4, 1fr);

      gap: 18px;

      margin-top: 20px;
    }

    .time-box {
      padding: 25px 15px;

      background: rgba(255, 255, 255, 0.16);

      border: 1px solid rgba(255, 255, 255, 0.25);

      border-radius: 18px;

      backdrop-filter: blur(5px);
      -webkit-backdrop-filter: blur(5px);

      transition:
        transform 0.3s ease,
        background 0.3s ease;
    }

    .time-box:hover {
      transform: translateY(-5px);

      background: rgba(255, 255, 255, 0.22);
    }

    .number {
      display: block;

      font-size: clamp(32px, 6vw, 55px);

      font-weight: 600;

      line-height: 1;

      margin-bottom: 10px;
    }

    .label {
      font-size: 12px;

      text-transform: uppercase;

      letter-spacing: 2px;

      opacity: 0.85;
    }

    .date {
      margin-top: 40px;

      font-family: "Playfair Display", serif;

      font-size: 20px;

      opacity: 0.95;
    }

    .message {
      display: none;

      font-family: "Playfair Display", serif;

      font-size: clamp(28px, 5vw, 48px);

      line-height: 1.3;
    }

    .footer {
      margin-top: 30px;

      font-size: 12px;

      letter-spacing: 1px;

      opacity: 0.7;
    }

    @keyframes latido {
      0%,
      100% {
        transform: scale(1);
      }

      50% {
        transform: scale(1.15);
      }
    }

    @keyframes aparecer {
      from {
        opacity: 0;

        transform: translateY(25px);
      }

      to {
        opacity: 1;

        transform: translateY(0);
      }
    }

    @media (max-width: 700px) {

      body {
        padding: 15px;
      }

      .container {
        padding: 40px 20px;
      }

      .countdown {
        grid-template-columns:
          repeat(2, 1fr);

        gap: 12px;
      }

      .time-box {
        padding: 22px 10px;
      }

      .number {
        font-size: 38px;
      }

      .label {
        font-size: 10px;

        letter-spacing: 1.5px;
      }

      .date {
        font-size: 17px;
      }
    }

    @media (max-width: 380px) {

      h1 {
        font-size: 35px;
      }

      .small-title {
        font-size: 11px;

        letter-spacing: 3px;
      }

      .subtitle {
        font-size: 14px;
      }
    }
  </style>
</head>

<body>

  <main class="container">

    <div class="small-title">
      El gran día se acerca
    </div>

    <h1>
      El gran día se acerca
      <span class="heart">♥</span>
    </h1>

    <p class="subtitle">
      Cada segundo nos acerca a un momento inolvidable
    </p>

    <div id="countdown" class="countdown">

      <div class="time-box">
        <span id="days" class="number">0</span>

        <span class="label">
          Días
        </span>
      </div>

      <div class="time-box">
        <span id="hours" class="number">0</span>

        <span class="label">
          Horas
        </span>
      </div>

      <div class="time-box">
        <span id="minutes" class="number">0</span>

        <span class="label">
          Minutos
        </span>
      </div>

      <div class="time-box">
        <span id="seconds" class="number">0</span>

        <span class="label">
          Segundos
        </span>
      </div>

    </div>

    <div id="message" class="message">

      💍 ¡LLEGÓ EL GRAN DÍA! 💍

      <br>

      <span style="font-size: 0.7em;">
        ¡Que vivan los novios! ❤️
      </span>

    </div>

    <div class="date">
      11 de octubre de 2026 · 4:00 p. m.
    </div>

    <div class="footer">
      Con amor, para celebrar un día inolvidable
    </div>

  </main>

  <script>

    /*
      FECHA DE LA BODA

      11 de octubre de 2026
      4:00 p. m.
      Hora de Colombia (UTC-5)

      El contador utiliza la hora actual del dispositivo
      y calcula cuánto tiempo falta realmente para el gran día.
    */

    const weddingDate =
      new Date("2026-10-11T16:00:00-05:00").getTime();


    function updateCountdown() {

      // Hora actual real
      const now =
        new Date().getTime();


      // Tiempo restante
      const difference =
        weddingDate - now;


      // Cuando llegue el día
      if (difference <= 0) {

        document.getElementById("countdown").style.display =
          "none";

        document.getElementById("message").style.display =
          "block";

        return;
      }


      // Cálculo de días
      const days =
        Math.floor(
          difference /
          (1000 * 60 * 60 * 24)
        );


      // Cálculo de horas
      const hours =
        Math.floor(
          (difference %
            (1000 * 60 * 60 * 24)) /
          (1000 * 60 * 60)
        );


      // Cálculo de minutos
      const minutes =
        Math.floor(
          (difference %
            (1000 * 60 * 60)) /
          (1000 * 60)
        );


      // Cálculo de segundos
      const seconds =
        Math.floor(
          (difference %
            (1000 * 60)) /
          1000
        );


      // Mostrar días
      document.getElementById("days").textContent =
        String(days).padStart(2, "0");


      // Mostrar horas
      document.getElementById("hours").textContent =
        String(hours).padStart(2, "0");


      // Mostrar minutos
      document.getElementById("minutes").textContent =
        String(minutes).padStart(2, "0");


      // Mostrar segundos
      document.getElementById("seconds").textContent =
        String(seconds).padStart(2, "0");
    }


    // Actualizar inmediatamente
    updateCountdown();


    // Actualizar cada segundo
    setInterval(
      updateCountdown,
      1000
    );

  </script>

</body>
</html>
