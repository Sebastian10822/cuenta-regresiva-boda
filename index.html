<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#080605">
  <title>Nuestra boda 💍</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&family=Playfair+Display:wght@500;600&display=swap" rel="stylesheet">
  <style>
    *{box-sizing:border-box}
    html,body{margin:0;min-height:100%;background:#080605;color:#fff}
    body{
      min-height:100vh;
      display:flex;
      align-items:center;
      justify-content:center;
      padding:20px;
      font-family:Montserrat,Arial,sans-serif;
      overflow-x:hidden;
    }
    .page{
      position:relative;
      width:min(1100px,100%);
      min-height:min(720px,calc(100vh - 40px));
      border-radius:24px;
      overflow:hidden;
      display:flex;
      align-items:center;
      justify-content:center;
      background:#111 url("boda.jpg") center/cover no-repeat;
      box-shadow:0 20px 80px rgba(0,0,0,.65);
    }
    .page::before{
      content:"";
      position:absolute;
      inset:0;
      background:
        linear-gradient(90deg,rgba(0,0,0,.08) 0%,rgba(0,0,0,.15) 38%,rgba(0,0,0,.72) 70%,rgba(0,0,0,.86) 100%),
        linear-gradient(0deg,rgba(0,0,0,.55),transparent 45%,rgba(0,0,0,.18));
    }
    .content{
      position:relative;
      z-index:2;
      width:100%;
      padding:clamp(28px,6vw,70px);
      display:flex;
      justify-content:flex-end;
    }
    .panel{
      width:min(590px,100%);
      text-align:center;
      padding:clamp(24px,4vw,48px);
      border:1px solid rgba(255,255,255,.28);
      border-radius:22px;
      background:rgba(10,8,7,.38);
      backdrop-filter:blur(8px);
      -webkit-backdrop-filter:blur(8px);
      box-shadow:0 15px 50px rgba(0,0,0,.25);
    }
    .small{font-size:10px;letter-spacing:.28em;text-transform:uppercase;color:rgba(255,255,255,.72)}
    h1{
      margin:10px 0 6px;
      font-family:"Playfair Display",serif;
      font-size:clamp(35px,6vw,62px);
      font-weight:500;
      letter-spacing:.02em;
    }
    .heart{font-size:23px;margin:8px 0 18px}
    .date{font-size:clamp(17px,3vw,25px);letter-spacing:.22em;font-weight:500}
    .time{margin-top:8px;color:rgba(255,255,255,.72);font-size:13px;letter-spacing:.22em}
    .countdown{
      margin-top:34px;
      display:grid;
      grid-template-columns:repeat(4,1fr);
      gap:8px;
    }
    .unit{
      padding:17px 6px 14px;
      border:1px solid rgba(255,255,255,.24);
      border-radius:12px;
      background:rgba(0,0,0,.25);
    }
    .number{
      font-size:clamp(25px,5vw,48px);
      font-weight:600;
      line-height:1;
      font-variant-numeric:tabular-nums;
      text-shadow:0 0 18px rgba(255,255,255,.22);
    }
    .label{
      margin-top:9px;
      font-size:8px;
      letter-spacing:.17em;
      color:rgba(255,255,255,.62);
    }
    .message{margin-top:28px;font-size:11px;letter-spacing:.18em;color:rgba(255,255,255,.76)}
    .status{margin-top:18px;font-size:9px;letter-spacing:.18em;color:rgba(255,255,255,.55)}
    .dot{display:inline-block;margin-right:6px;animation:blink 1s steps(2,end) infinite}
    @keyframes blink{50%{opacity:.2}}
    @media(max-width:700px){
      body{padding:0}
      .page{min-height:100vh;border-radius:0}
      .page::before{
        background:linear-gradient(180deg,rgba(0,0,0,.18),rgba(0,0,0,.7) 55%,rgba(0,0,0,.9));
      }
      .content{justify-content:center;padding:18px}
      .panel{padding:25px 14px;background:rgba(10,8,7,.48)}
      .countdown{gap:5px}
      .unit{padding:14px 3px 12px}
      .date{letter-spacing:.12em}
      .small{letter-spacing:.18em}
    }
  </style>
</head>
<body>
  <main class="page">
    <div class="content">
      <section class="panel" aria-live="polite">
        <div class="small">Cuenta regresiva</div>
        <h1>Nuestra boda</h1>
        <div class="heart">♡</div>
        <div class="date">11 OCTUBRE 2026</div>
        <div class="time">4:00 P. M. · HORA DE COLOMBIA</div>

        <div class="countdown">
          <div class="unit"><div class="number" id="days">00</div><div class="label">DÍAS</div></div>
          <div class="unit"><div class="number" id="hours">00</div><div class="label">HORAS</div></div>
          <div class="unit"><div class="number" id="minutes">00</div><div class="label">MINUTOS</div></div>
          <div class="unit"><div class="number" id="seconds">00</div><div class="label">SEGUNDOS</div></div>
        </div>

        <div class="message" id="message">Cada segundo nos acerca a nuestro gran día</div>
        <div class="status"><span class="dot">●</span> CUENTA REGRESIVA ACTIVA</div>
      </section>
    </div>
  </main>

  <script>
    // Fecha fija del matrimonio: 11 de octubre de 2026, 4:00 p. m., Colombia (UTC-5).
    // El tiempo restante NO está escrito manualmente: se calcula desde el momento
    // exacto en que cada persona abre la página y se actualiza cada segundo.
    const target = new Date("2026-10-11T16:00:00-05:00").getTime();

    const el = id => document.getElementById(id);
    const pad = n => String(n).padStart(2, "0");

    function updateCountdown(){
      const diff = Math.max(0, target - Date.now());
      const total = Math.floor(diff / 1000);

      const days = Math.floor(total / 86400);
      const hours = Math.floor((total % 86400) / 3600);
      const minutes = Math.floor((total % 3600) / 60);
      const seconds = total % 60;

      el("days").textContent = pad(days);
      el("hours").textContent = pad(hours);
      el("minutes").textContent = pad(minutes);
      el("seconds").textContent = pad(seconds);

      if(diff <= 0){
        el("message").textContent = "💍 ¡LLEGÓ EL GRAN DÍA! ¡QUE VIVAN LOS NOVIOS!";
        document.title = "💍 ¡Llegó el gran día!";
      }
    }

    updateCountdown();
    setInterval(updateCountdown, 1000);
  </script>
</body>
</html>
